<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Movimiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-lg mx-auto bg-white p-6 rounded-xl shadow-md border">
        <h2 class="text-xl font-bold mb-4 text-gray-800">📝 Editar Movimiento</h2>
        <form action="/actualizar-movimiento/{{ m[0] }}" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Fecha</label>
                <input type="date" name="fecha" value="{{ m[5] }}" required class="w-full p-2 border rounded-lg bg-gray-50">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Tipo</label>
                    <select name="tipo" class="w-full p-2 border rounded-lg bg-gray-50">
                        <option value="INGRESO" {% if m[1]=='INGRESO' %}selected{% endif %}>📥 Ingreso</option>
                        <option value="EGRESO" {% if m[1]=='EGRESO' %}selected{% endif %}>📤 Egreso</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Método</label>
                    <select name="metodo" class="w-full p-2 border rounded-lg bg-gray-50">
                        <option value="EFECTIVO" {% if m[6]=='EFECTIVO' %}selected{% endif %}>💵 Efectivo</option>
                        <option value="TRANSFERENCIA" {% if m[6]=='TRANSFERENCIA' %}selected{% endif %}>📱 Transferencia</option>
                        <option value="DEBITO" {% if m[6]=='DEBITO' %}selected{% endif %}>💳 Débito</option>
                        <option value="CREDITO" {% if m[6]=='CREDITO' %}selected{% endif %}>💳 Crédito</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Tipo de Gasto</label>
                    <select name="tipo_gasto" class="w-full p-2 border rounded-lg bg-gray-50">
                        <option value="OPERATIVO" {% if m[7]=='OPERATIVO' %}selected{% endif %}>🏢 Operativo</option>
                        <option value="INVERSION" {% if m[7]=='INVERSION' %}selected{% endif %}>🏗️ Inversión</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Socio / Responsable</label>
                    <select name="socio" class="w-full p-2 border rounded-lg bg-gray-50">
                        <option value="AMBOS" {% if m[8]=='AMBOS' %}selected{% endif %}>🤝 Ambos</option>
                        <option value="NOVIA" {% if m[8]=='NOVIA' %}selected{% endif %}>👤 Paola</option>
                        <option value="COMPAÑERO" {% if m[8]=='COMPAÑERO' %}selected{% endif %}>👤 Jorge</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Concepto</label>
                <input type="text" name="concepto" value="{{ m[2] }}" required class="w-full p-2 border rounded-lg bg-gray-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Categoría</label>
                <input type="text" name="categoria" value="{{ m[3] }}" required class="w-full p-2 border rounded-lg bg-gray-50">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">Monto ($)</label>
                <input type="number" step="0.01" name="monto" value="{{ m[4] }}" required class="w-full p-2 border rounded-lg bg-gray-50">
            </div>

            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold w-full py-2.5 rounded-lg shadow-sm">Guardar Cambios</button>
            <a href="/" class="block text-center text-gray-500 hover:underline text-sm mt-2">Cancelar</a>
        </form>
    </div>
</body>
</html>
